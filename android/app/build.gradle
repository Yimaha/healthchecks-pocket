import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Version comes from package.json, so it's set in one place: "1.2.3" ->
// versionName 1.2.3, versionCode 10203.
def appVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.-+')[0..2].collect { it.toInteger() }

// Release signing: android/keystore.properties (scripts/make-keystore.sh), or
// HCP_KEYSTORE_FILE / HCP_KEYSTORE_PASSWORD / HCP_KEY_ALIAS / HCP_KEY_PASSWORD
// environment variables (CI). Without either, or with -PhcpUnsigned (scripts/android.sh
// verify-release, which needs no key), release builds are unsigned.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signing = { String prop, String env -> System.getenv(env) ?: keystoreProps.getProperty(prop) }
def releaseStoreFile = project.hasProperty('hcpUnsigned') ? null : signing('storeFile', 'HCP_KEYSTORE_FILE')

android {
    namespace = "io.github.yimaha.healthcheckspocket"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.yimaha.healthcheckspocket"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersion
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signing('storePassword', 'HCP_KEYSTORE_PASSWORD')
                keyAlias signing('keyAlias', 'HCP_KEY_ALIAS')
                keyPassword signing('keyPassword', 'HCP_KEY_PASSWORD')
                // v3 carries a signing lineage, so a future release can rotate to a new key and old installs still update.
                // The CI signing job signs with apksigner and enables v3 there too; this covers local release builds.
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // No JUnit or Espresso: the app's Android tests are tests/android, run with Playwright on the emulator.
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
