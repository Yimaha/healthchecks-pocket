name: CI

on:
  push:
    branches: [main]
  pull_request:

# Third-party actions are pinned to commit SHAs (tags can be moved).
permissions:
  contents: read

jobs:
  # Lint, unit and screen tests (Vitest) with their line coverage, then the browser
  # tests (Playwright) against the production build.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint # oxlint + pinned ShellCheck
      - run: npm run test:coverage # fails below the line coverage floor (vite.config.ts)
      # A PR may not lower line coverage: the branch it merges into is measured the same way, in base/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Line coverage not below the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          (cd base && npm ci --no-audit --no-fund && npx vitest run --coverage --coverage.reporter=json-summary --reporter=dot)
          # shellcheck disable=SC2016 # the ${...} are JavaScript's, not the shell's
          node -e '
            const linePct = (summary) => require(summary).total.lines.pct;
            const pr = linePct("./coverage/coverage-summary.json"), base = linePct("./base/coverage/coverage-summary.json");
            const branch = process.env.BASE_BRANCH;
            if (pr < base) {
              console.log(`::error::Line coverage fell from ${base}% (${branch}) to ${pr}%. Add tests for the lines this change adds or leaves uncovered (npm run test:coverage; coverage/index.html shows which).`);
              process.exit(1);
            }
            console.log(`Line coverage: ${pr}%, not below ${branch} (${base}%)`);'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  # The Android app builds from a fresh machine with the setup script.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools # its default also asks for 'tools', which Google removed
          log-accepted-android-sdk-licenses: false

      # Exercises the same setup script contributors run.
      - run: scripts/setup.sh --yes
      - run: scripts/android.sh build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: healthchecks-pocket-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # The app on an Android emulator (android-emulator.yml), on PRs too: nothing else runs those tests before a merge.
  android-emulator:
    uses: ./.github/workflows/android-emulator.yml
