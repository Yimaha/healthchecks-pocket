# Builds the signed release APK when a version tag is pushed and attaches it
# (with its SHA-256) to a GitHub release:
#
#   npm version 0.3.0 && git push --follow-tags
#
# The release text is that version's section of CHANGELOG.md
# (scripts/release-notes.sh); the tests job fails without one.
#
# The signing key is stored as secrets of the "release" environment
# (Settings > Environments > release), which only accepts v* tags and waits
# for the owner's approval before the signing job starts:
#   HCP_KEYSTORE_BASE64    base64 of the release keystore (base64 < release.jks)
#   HCP_KEYSTORE_PASSWORD  its password (from android/keystore.properties)
#
# The tests run first, without the key: the web tests, and the app on an
# Android emulator (android-emulator.yml). Only a passing build asks for
# approval. The jobs that see the key are read-only; only the publish job,
# which just uploads the finished APK, can write to the repo.
# Third-party actions are pinned to commit SHAs (tags can be moved).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One release at a time; a second tag waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

# Releases run on a fixed Ubuntu version, so a runner image change can't break one; CI (ubuntu-latest) meets new images first.
jobs:
  # Never publish a build that fails the tests.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: CHANGELOG.md has notes for this version
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint # oxlint + pinned ShellCheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  android-emulator:
    uses: ./.github/workflows/android-emulator.yml

  build:
    needs: [test, android-emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools # its default also asks for 'tools', which Google removed
          log-accepted-android-sdk-licenses: false

      - run: scripts/setup.sh --yes

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HCP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "HCP_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        run: scripts/android.sh release
        env:
          HCP_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          HCP_KEYSTORE_PASSWORD: ${{ secrets.HCP_KEYSTORE_PASSWORD }}
          HCP_KEY_ALIAS: release
          HCP_KEY_PASSWORD: ${{ secrets.HCP_KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version's section of CHANGELOG.md, then GitHub's link to the
      # full list of commits since the previous release.
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-apk
          path: release

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
