# Builds the signed release APK when a version tag is pushed and attaches it
# (with its SHA-256) to a GitHub release:
#
#   npm version 0.3.0 && git push --follow-tags
#
# The signing key is stored as secrets of the "release" environment
# (Settings > Environments > release), which only accepts v* tags and waits
# for the owner's approval before the signing job starts:
#   HCP_KEYSTORE_BASE64    base64 of the release keystore (base64 < release.jks)
#   HCP_KEYSTORE_PASSWORD  its password (from android/keystore.properties)
#
# The tests run first, without the key; only a passing build asks for
# approval. The jobs that see the key are read-only; only the publish job,
# which just uploads the finished APK, can write to the repo.
# Third-party actions are pinned to commit SHAs (tags can be moved).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Never publish a build that fails the tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint # oxlint + pinned ShellCheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - run: scripts/setup.sh --yes

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HCP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "HCP_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        run: scripts/android.sh release
        env:
          HCP_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          HCP_KEYSTORE_PASSWORD: ${{ secrets.HCP_KEYSTORE_PASSWORD }}
          HCP_KEY_ALIAS: release
          HCP_KEY_PASSWORD: ${{ secrets.HCP_KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apk
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apk
          path: release

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          generate_release_notes: true
